<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Florist Website</title>
</head>
<body>
    <header class="bg-primary text-white text-center p-5">
        <h1>Welcome to Our Florist</h1>
        <p>Beautiful bouquets for every occasion</p>
    </header>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 animate__animated animate__fadeIn">
                <img src="flower1.jpg" class="img-fluid" alt="Flower 1">
                <h3>Bouquet 1</h3>
                <p>Elegant roses for your loved one.</p>
            </div>
            <div class="col-md-4 animate__animated animate__fadeIn">
                <img src="flower2.jpg" class="img-fluid" alt="Flower 2">
                <h3>Bouquet 2</h3>
                <p>Joyful tulips for every celebration.</p>
            </div>
            <div class="col-md-4 animate__animated animate__fadeIn">
                <img src="flower3.jpg" class="img-fluid" alt="Flower 3">
                <h3>Bouquet 3</h3>
                <p>Charming lilies for your special moments.</p>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
