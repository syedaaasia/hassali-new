<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="glass-nav">
        <h1>Jewellery Shop</h1>
    </nav>
    <header class="hero">
        <img src="https://source.unsplash.com/1400x1000/?jewellery" alt="Luxurious jewellery" class="hero-img">
        <div class="hero-content">
            <h2>Accessorize with Elegance</h2>
            <a href="#shop" class="cta-button">Shop Now</a>
        </div>
    </header>
    <section id="products" class="product-cards">
        <h2>Featured Jewellery</h2>
        <div class="card">
            <img src="https://source.unsplash.com/300x400/?ring" alt="Ring 1" class="product-img animated">
        </div>
        <div class="card">
            <img src="https://source.unsplash.com/300x400/?necklace" alt="Necklace 1" class="product-img animated">
        </div>
        <div class="card">
            <img src="https://source.unsplash.com/300x400/?earrings" alt="Earrings 1" class="product-img animated">
        </div>
    </section>
    <section id="about" class="about-panel">
        <h2>About Our Collection</h2>
        <p>Explore a variety of exquisite jewellery that complements your style.</p>
    </section>
    <footer class="footer">
        <p>© 2023 Jewellery Shop. All rights reserved.</p>
    </footer>
</body>
</html>
