<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Seller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="glass-nav">
        <h1>Shoe Seller</h1>
    </nav>
    <header class="hero">
        <img src="https://source.unsplash.com/1400x1000/?luxury-shoes" alt="Luxurious shoes" style="object-fit: cover; width: 100%; height: auto;">
        <div class="hero-content">
            <h2>The Perfect Pair Awaits</h2>
            <a href="#shop" class="cta-button">Shop Now</a>
        </div>
    </header>
    <section id="products" class="product-cards">
        <h2>Featured Shoes</h2>
        <div class="card">
            <img src="https://source.unsplash.com/300x400/?shoe" alt="Shoe 1" class="product-img">
        </div>
        <div class="card">
            <img src="https://source.unsplash.com/300x400/?sneaker" alt="Shoe 2" class="product-img">
        </div>
        <div class="card">
            <img src="https://source.unsplash.com/300x400/?dress-shoe" alt="Shoe 3" class="product-img">
        </div>
        <!-- Add more product cards as needed -->
    </section>
    <section id="about" class="about-panel">
        <h2>About Our Collection</h2>
        <p>Explore a variety of premium shoes that blend comfort and style.</p>
    </section>
    <footer class="footer">
        <p>© 2023 Shoe Seller. All rights reserved.</p>
    </footer>
</body>
</html>
