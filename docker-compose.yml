services:
  postgres:
    image: postgres:16-alpine
    container_name: hassali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hassali
      POSTGRES_USER: hassali
      POSTGRES_PASSWORD: hassali
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hassali-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: hassali-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.5.7
    container_name: hassali-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  qdrant-data:
  ollama-data:
